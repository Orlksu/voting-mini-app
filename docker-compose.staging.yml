services:
  frontend:
    ports:
      - "${STAGING_FRONTEND_PORT:-80}:80"

  backend:
    build:
      args:
        DB_HOST: "${DB_HOST:-db}"
        DB_PORT: "${DB_PORT:-5432}"
        DB_NAME: "${POSTGRES_DB:-lctdb}"
        DB_USER: "${POSTGRES_USER:-user}"
        DB_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=${POSTGRES_DB:-lctdb};Username=${POSTGRES_USER:-user};Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}"
      Valhalla__BaseUrl: "http://valhalla:8002"
    ports:
      - "${STAGING_BACKEND_PORT:-5001}:8080"

  db:
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-user}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}"
      POSTGRES_DB: "${POSTGRES_DB:-lctdb}"
    ports: []

  valhalla:
    ports: []
