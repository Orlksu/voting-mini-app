services:
  frontend:
    build:
      args:
        VITE_API_URL: "${VITE_API_URL:-/api/v1}"
        VITE_MAPTILER_API_KEY: "${VITE_MAPTILER_API_KEY:?VITE_MAPTILER_API_KEY must be set}"
    ports:
      - "${STAGING_FRONTEND_PORT:-8080}:80"

  backend:
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Valhalla__BaseUrl: "http://valhalla:8002"
    ports:
      - "${STAGING_BACKEND_PORT:-5001}:8080"

  db:
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-user}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}"
      POSTGRES_DB: "${POSTGRES_DB:-lctdb}"
    # !reset: пустой список ports в override НЕ убирает порты из базового
    # файла (списки конкатенируются), иначе PostgreSQL публикуется наружу.
    ports: !reset []

  valhalla:
    ports: !reset []
    environment:
      # Число потоков и для сборки тайлов, и для сервиса. На VM с 2 ГБ RAM сборку графа
      # Москвы с областью запускать с VALHALLA_SERVER_THREADS=1 (docs/valhalla.md).
      - server_threads=${VALHALLA_SERVER_THREADS:-2}
    healthcheck:
      # Сборка графа на staging VM идёт долго; до готовности тайлов /status не отвечает.
      start_period: 180m
