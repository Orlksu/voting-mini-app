        const container = document.getElementById('routeContainer');

            const card = document.createElement('div');
            card.className = 'route-card';
            card.innerHTML = `
                <div class="route-head" style="background: ${color}">
                    <span>${route.engineerName} (${route.transport})</span>
                    <span style="font-size: 11px; background: rgba(0,0,0,0.2); padding: 2px 8px; border-radius: 12px;">${route.stops.length} заявок, ${route.totalDistanceKm} км</span>

                <div class="route-stops">

                        <div class="stop-item">
                            <span style="font-weight:bold; color:${color}">#${s.sequence}</span>
                            <div>
                                <div><strong>№${s.externalOrderId}</strong> — ${s.address}</div>

                    fillColor: color,
                    color: '#ffffff',
                    weight: 2,
                    opacity: 1,
                    fillOpacity: 0.95

                    </div>
                `);

            if (geom.length > 1) {
