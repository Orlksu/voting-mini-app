services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: "${VITE_API_URL:-/api/v1}"
        VITE_MAPTILER_API_KEY: "${VITE_MAPTILER_API_KEY:-}"
    ports:
      - "8080:80"
    restart: unless-stopped
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5001:8080"
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Host=${DB_HOST:-db};Port=${DB_PORT:-5432};Database=${POSTGRES_DB:-lctdb};Username=${POSTGRES_USER:-user};Password=${POSTGRES_PASSWORD:-password}"
      Valhalla__BaseUrl: "http://valhalla:8002"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17
    container_name: lct-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-user}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-password}"
      POSTGRES_DB: "${POSTGRES_DB:-lctdb}"
    ports:
      - "5432:5432"         # наружу пробрасываем, чтобы удобно подключаться из IDE
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  valhalla:
    # Пин фиксированной версии: latest — плавающий тег, повторный
    # `up -d --build` может молча подтянуть другую версию движка.
    image: ghcr.io/gis-ops/docker-valhalla/valhalla:3.5.1
    container_name: lct-valhalla
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - "8002:8002"
    environment:
      - tile_urls=https://download.bbbike.org/osm/bbbike/Moscow/Moscow.osm.pbf
      - build_elevation=False
      - build_admins=False
      - build_time_zones=False
      - serve_tiles=True
    volumes:
      - ./valhalla-data:/custom_files
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/status"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s

volumes:
  postgres_data:
